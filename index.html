<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Night Camp Database · Dashboard</title>
  <meta name="description" content="Night Camp Wiki Database Dashboard — ฐานข้อมูลเกม Night Camp ครบทุกหมวด (มอนสเตอร์ อาวุธ ชุด เซ็ต อาชีพ สกิล แผนที่ ดรอป รูน เควสต์)">
  <meta name="theme-color" content="#0d0b1a">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css?v=20261128b">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Navigation">
      <div class="sidebar__brand">
        <img class="sidebar__logo" src="assets/logo.webp" alt="Night Camp Season 2">
        <div class="sidebar__meta">
          <strong>Night Camp DB</strong>
          <span id="seasonBadge">SS2 · v0.2</span>
        </div>
      </div>

      <nav class="nav" id="navMenu"></nav>

      <div class="sidebar__foot">
        <a class="ext-link" href="https://play.nightcamp.app/wiki/index.html" target="_blank" rel="noopener noreferrer">
          Official Wiki ↗
        </a>
        <div class="build-info" id="buildInfo"></div>
      </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <div class="shell">
      <header class="topbar">
        <button class="icon-btn mobile-menu-btn" id="mobileMenuBtn" type="button" aria-label="Toggle Menu">☰</button>

        <div class="global-search" id="globalSearchWrap">
          <span class="global-search__icon">🔍</span>
          <input id="globalSearchInput" type="search" autocomplete="off" placeholder="ค้นหาทุกหมวด... (Ctrl+K)">
          <kbd class="kbd">Ctrl K</kbd>
          <div class="search-dropdown" id="globalSearchResults" hidden></div>
        </div>

        <div class="topbar__actions">
          <button class="lang-btn" id="langToggle" type="button" title="Switch Language">
            <span class="lang-pill" id="langPillTH">TH</span>
            <span class="lang-pill" id="langPillEN">EN</span>
          </button>
        </div>
      </header>

      <main class="main" id="mainView">
        <div class="loading-box">Loading Night Camp Database...</div>
      </main>
    </div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" id="modalDialog" role="dialog" aria-modal="true">
      <button class="modal__back" id="modalBack" type="button" aria-label="Back" hidden></button>
      <button class="modal__close" id="modalClose" type="button" aria-label="Close">✕</button>
      <div class="modal__body" id="modalBody"></div>
    </div>
  </div>

  <script>
    window.NCWLang = {
      dict: { data: {}, ui: {} },
      apply: function (d) { this.dict = d || { data: {}, ui: {} }; }
    };
  </script>
  <script src="data/wiki_en.js?v=20261128b"></script>
  <script src="data/i18n_th.js?v=20261128b"></script>
  <script src="data/new_ids.js?v=20261128b"></script>
  <script src="app.js?v=20261128b"></script>
</body>
</html>
